<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/provisions-dashboard/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Provisions Dashboard</title>
    <style>
      html,body{margin:0;min-height:100%;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,sans-serif}
      #boot{padding:2rem 1.25rem;text-align:center}
      #boot h1{font-size:1.125rem;margin:0 0 .5rem}
      #boot p{margin:0;color:#64748b;font-size:.875rem}
      #boot.error{color:#be123c}
    </style>
    <script type="module" crossorigin src="/provisions-dashboard/assets/index-K85hYXct.js?v=20260919b"></script>
    <link rel="stylesheet" crossorigin href="/provisions-dashboard/assets/index-Cmwdl9Nr.css?v=20260919b">
  </head>
  <body>
    <div id="root">
      <div id="boot"><h1>Provisions</h1><p>Loading dashboard…</p></div>
    </div>
    <script>
      window.addEventListener('error',function(e){
        var el=document.getElementById('boot');
        if(!el||el.dataset.shown)return;
        el.dataset.shown='1';el.className='error';
        el.innerHTML='<h1>Could not load</h1><p>'+(e.message||'Unknown error')+'</p><p style="margin-top:.75rem">Hard-refresh (pull down) or open in Chrome.</p>';
      });
    </script>
  </body>
</html>
