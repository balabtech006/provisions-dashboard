name: Publish Pages assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/asset-payloads/**'
      - '.github/workflows/publish-assets.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode and publish assets to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/out/assets
          python3 <<'PY'
          import base64, gzip, json, pathlib, hashlib
          root = pathlib.Path('.github/asset-payloads')
          patches = {p['file']: p['fixes'] for p in json.loads((root / 'PATCHES.json').read_text())}

          def apply(name: str, text: str) -> str:
              arr = list(text)
              for idx, ch in patches.get(name, []):
                  arr[idx] = ch
              return ''.join(arr)

          def load_js_chunk(i: int) -> str:
              name = f'js_{i:02d}.b64'
              parts = sorted(root.glob(f'js_{i:02d}p*.b64'))
              if parts:
                  return ''.join(p.read_text().strip() for p in parts)
              return apply(name, (root / name).read_text().strip())

          css_b64 = apply('css_all.b64', (root / 'css_all.b64').read_text().strip())
          js_b64 = ''.join(load_js_chunk(i) for i in range(13))
          css = gzip.decompress(base64.b64decode(css_b64))
          js = gzip.decompress(base64.b64decode(js_b64))
          css_path = pathlib.Path('/tmp/out/assets/index-Cmwdl9Nr.css')
          js_path = pathlib.Path('/tmp/out/assets/index-K85hYXct.js')
          css_path.write_bytes(css)
          js_path.write_bytes(js)
          print('decoded css', len(css), hashlib.sha256(css).hexdigest()[:16])
          print('decoded js', len(js), hashlib.sha256(js).hexdigest()[:16])
          assert len(css) == 27826
          assert len(js) == 250566
          assert hashlib.sha256(css).hexdigest().startswith('608bb01cbec3f970')
          assert hashlib.sha256(js).hexdigest().startswith('a087279a6d6a7e7a')
          PY
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/balabtech006/provisions-dashboard.git" /tmp/ghp
          mkdir -p /tmp/ghp/assets
          cp /tmp/out/assets/index-Cmwdl9Nr.css /tmp/out/assets/index-K85hYXct.js /tmp/ghp/assets/
          cd /tmp/ghp
          git add assets/index-Cmwdl9Nr.css assets/index-K85hYXct.js
          git status
          git commit -m "Publish real dist CSS+JS assets via Actions" || echo "no changes"
          git push origin gh-pages
